<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나만의 오답노트</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="오답노트">
<meta name="theme-color" content="#12112A">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
:root {
  --bg:#12112A; --surface:#1E1D3A; --card:#252444; --border:#35336A;
  --purple:#7B5EA7; --purple-light:#9B7EC7; --gold:#F0C26E;
  --text:#E8E0F0; --text-dim:#9990B8; --red:#E07070; --green:#6EC97E;
  --radius:14px;
}
body { font-family:'Noto Sans KR',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; flex-direction:column; }

header { padding:20px 28px 0; display:flex; align-items:center; gap:12px; }
.logo { font-size:22px; font-weight:900; letter-spacing:-.5px; }
.logo span { color:var(--gold); }
.count-badge { margin-left:auto; font-size:13px; color:var(--text-dim); background:var(--card); padding:4px 12px; border-radius:20px; border:1px solid var(--border); }
.count-badge strong { color:var(--gold); }

.tabs { display:flex; gap:4px; padding:16px 28px 0; }
.tab { padding:9px 20px; border-radius:10px 10px 0 0; border:1px solid transparent; border-bottom:none; cursor:pointer; font-size:14px; font-weight:500; color:var(--text-dim); background:transparent; transition:all .2s; font-family:inherit; }
.tab.active { background:var(--surface); color:var(--text); border-color:var(--border); }
.tab .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--red); margin-left:6px; vertical-align:middle; }

main { flex:1; background:var(--surface); border-top:1px solid var(--border); padding:28px; }
.panel { display:none; } .panel.active { display:block; }

.section-title { font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--purple-light); margin-bottom:14px; }
.form-group { margin-bottom:20px; }
label { display:block; font-size:13px; color:var(--text-dim); margin-bottom:6px; font-weight:500; }
input[type="text"], textarea, select {
  width:100%; background:var(--card); border:1px solid var(--border); border-radius:10px;
  padding:10px 14px; color:var(--text); font-family:inherit; font-size:15px; outline:none; resize:vertical; transition:border-color .2s;
}
input[type="text"]:focus, textarea:focus, select:focus { border-color:var(--purple); }
textarea { min-height:72px; }
select option { background:var(--card); }

/* CONTENT BLOCK */
.content-block { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
.content-block-header { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border-bottom:1px solid var(--border); font-size:12px; font-weight:700; color:var(--text-dim); letter-spacing:.05em; }
.content-block-body { padding:12px 14px; display:flex; flex-direction:column; gap:10px; }
.content-block textarea { background:var(--bg); border-color:var(--border); border-radius:8px; min-height:64px; font-size:14px; }

/* IMAGE DROP ZONE */
.img-drop-zone { background:var(--bg); border:2px dashed var(--border); border-radius:10px; min-height:110px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; position:relative; overflow:hidden; transition:border-color .2s, background .2s; gap:5px; }
.img-drop-zone:hover, .img-drop-zone.drag-over { border-color:var(--purple); background:rgba(123,94,167,.07); }
.img-drop-zone.has-image { border-style:solid; border-color:var(--purple); min-height:150px; }
.img-drop-zone input[type="file"] { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; z-index:1; }
.dz-icon { font-size:22px; pointer-events:none; }
.dz-label { font-size:12px; color:var(--text-dim); text-align:center; pointer-events:none; line-height:1.5; }
.dz-label b { color:var(--purple-light); font-weight:600; }
.dz-preview { width:100%; max-height:200px; object-fit:contain; display:none; border-radius:8px; }
.img-drop-zone.has-image .dz-icon, .img-drop-zone.has-image .dz-label { display:none; }
.img-drop-zone.has-image .dz-preview { display:block; }
.img-remove-btn { display:none; position:absolute; top:8px; right:8px; width:26px; height:26px; background:rgba(0,0,0,.65); border:none; border-radius:50%; color:#fff; font-size:13px; cursor:pointer; align-items:center; justify-content:center; z-index:2; }
.img-drop-zone.has-image .img-remove-btn { display:flex; }
.paste-kbd { display:inline-block; background:var(--border); border-radius:4px; padding:1px 5px; font-size:11px; font-family:monospace; color:var(--text-dim); }

/* BUTTONS */
.btn { display:inline-flex; align-items:center; gap:7px; padding:10px 22px; border-radius:10px; border:none; font-family:inherit; font-size:14px; font-weight:600; cursor:pointer; transition:all .18s; }
.btn-primary { background:var(--purple); color:#fff; }
.btn-primary:hover { background:var(--purple-light); transform:translateY(-1px); }
.btn-gold { background:var(--gold); color:#1A1230; }
.btn-gold:hover { background:#f5d08c; transform:translateY(-1px); }
.btn-ghost { background:var(--card); color:var(--text); border:1px solid var(--border); }
.btn-ghost:hover { border-color:var(--purple-light); }
.btn-danger { background:transparent; color:var(--red); border:1px solid var(--red); font-size:12px; padding:6px 12px; }
.btn-danger:hover { background:var(--red); color:#fff; }
.btn-row { display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; }

/* Q LIST */
.q-list { margin-top:28px; }
.q-item { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; margin-bottom:10px; display:flex; align-items:flex-start; gap:12px; animation:fadeUp .25s ease; }
@keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.q-num { width:32px; height:32px; border-radius:8px; background:var(--purple); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; flex-shrink:0; color:#fff; }
.q-body { flex:1; min-width:0; }
.q-preview-row { display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap; margin-bottom:6px; }
.q-preview-col { display:flex; flex-direction:column; gap:4px; max-width:180px; }
.q-preview-label { font-size:10px; color:var(--text-dim); font-weight:700; letter-spacing:.04em; }
.q-preview-text { font-size:13px; line-height:1.5; white-space:pre-wrap; word-break:break-all; }
.q-thumb { width:80px; height:52px; object-fit:cover; border-radius:7px; border:1px solid var(--border); background:var(--bg); cursor:pointer; transition:opacity .15s; }
.q-thumb:hover { opacity:.8; }
.q-meta { font-size:12px; color:var(--text-dim); display:flex; gap:8px; flex-wrap:wrap; }
.q-tag { padding:2px 8px; border-radius:5px; background:var(--border); font-size:11px; }
.q-actions { flex-shrink:0; }

/* ── UNIT SELECT SCREEN ── */
.unit-select { padding:4px 0; }
.unit-select-title { font-size:18px; font-weight:700; margin-bottom:6px; }
.unit-select-sub { font-size:13px; color:var(--text-dim); margin-bottom:20px; }
.unit-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; margin-bottom:24px; }
.unit-card {
  background:var(--card); border:2px solid var(--border); border-radius:var(--radius);
  padding:18px 16px; cursor:pointer; transition:all .18s; position:relative;
}
.unit-card:hover { border-color:var(--purple); transform:translateY(-2px); }
.unit-card.selected { border-color:var(--gold); background:rgba(240,194,110,.07); }
.unit-card-name { font-size:15px; font-weight:700; margin-bottom:4px; }
.unit-card-count { font-size:12px; color:var(--text-dim); }
.unit-card-check { position:absolute; top:10px; right:12px; font-size:18px; display:none; }
.unit-card.selected .unit-card-check { display:block; }
.unit-all-card { grid-column:1/-1; border-color:var(--purple); }
.unit-all-card:hover { border-color:var(--purple-light); }
.unit-all-card.selected { border-color:var(--gold); }

/* QUIZ */
.quiz-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
.quiz-progress { font-size:13px; color:var(--text-dim); }
.quiz-unit-badge { font-size:12px; color:var(--gold); background:rgba(240,194,110,.1); padding:3px 10px; border-radius:20px; border:1px solid rgba(240,194,110,.3); }
.progress-bar { height:4px; background:var(--border); border-radius:4px; margin-bottom:24px; overflow:hidden; }
.progress-fill { height:100%; background:linear-gradient(90deg,var(--purple),var(--gold)); border-radius:4px; transition:width .4s ease; }
.quiz-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:22px; margin-bottom:16px; }
.quiz-q-num { font-size:12px; font-weight:700; color:var(--purple-light); letter-spacing:.06em; text-transform:uppercase; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
.quiz-text { font-size:16px; line-height:1.7; white-space:pre-wrap; margin-bottom:10px; }
.quiz-img { width:100%; max-height:320px; object-fit:contain; border-radius:10px; border:1px solid var(--border); background:var(--bg); cursor:zoom-in; margin-bottom:10px; }
.reveal-btn { width:100%; padding:14px; background:var(--border); border:none; border-radius:10px; color:var(--text); font-family:inherit; font-size:15px; font-weight:600; cursor:pointer; transition:background .2s; }
.reveal-btn:hover { background:var(--purple); }
.answer-reveal { display:none; margin-top:16px; padding-top:16px; border-top:1px solid var(--border); }
.answer-reveal.open { display:block; }
.answer-label { font-size:12px; font-weight:700; color:var(--green); letter-spacing:.05em; margin-bottom:8px; }
.explain-text { font-size:13px; color:var(--text-dim); line-height:1.7; margin-top:10px; white-space:pre-wrap; }
.self-judge { display:flex; gap:10px; margin-top:16px; }
.self-judge .btn { flex:1; justify-content:center; }
.quiz-nav { display:flex; gap:10px; justify-content:space-between; align-items:center; }
.quiz-back-btn { font-size:13px; padding:8px 14px; }

/* ── WRONG NOTE ── */
.wrong-top-bar { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:16px; }
.wrong-filters { display:flex; gap:8px; flex-wrap:wrap; }
.filter-btn { padding:6px 14px; border-radius:20px; border:1px solid var(--border); background:transparent; color:var(--text-dim); font-size:13px; font-family:inherit; cursor:pointer; transition:all .15s; }
.filter-btn.active { background:var(--purple); color:#fff; border-color:var(--purple); }

/* view toggle */
.view-toggle { display:flex; gap:0; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
.view-toggle button { padding:6px 14px; background:transparent; border:none; font-family:inherit; font-size:13px; color:var(--text-dim); cursor:pointer; transition:all .15s; }
.view-toggle button.active { background:var(--purple); color:#fff; }

/* unit group */
.unit-group { margin-bottom:28px; }
.unit-group-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 14px; background:var(--card); border:1px solid var(--border);
  border-radius:10px; margin-bottom:10px; cursor:pointer; user-select:none;
}
.unit-group-title { font-size:14px; font-weight:700; display:flex; align-items:center; gap:8px; }
.unit-group-count { font-size:12px; color:var(--text-dim); }
.unit-group-arrow { font-size:12px; color:var(--text-dim); transition:transform .2s; }
.unit-group.collapsed .unit-group-arrow { transform:rotate(-90deg); }
.unit-group-body { display:block; }
.unit-group.collapsed .unit-group-body { display:none; }

.wrong-card { background:var(--card); border:1px solid var(--border); border-left:4px solid var(--red); border-radius:var(--radius); padding:16px 18px; margin-bottom:10px; animation:fadeUp .25s ease; }
.wrong-card.mastered { border-left-color:var(--green); opacity:.7; }
.wrong-preview-row { display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap; margin-bottom:10px; }
.wrong-meta { font-size:12px; color:var(--text-dim); display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
.mastered-badge { font-size:11px; padding:2px 8px; border-radius:5px; background:rgba(110,201,126,.2); color:var(--green); font-weight:600; }
.wrong-explain { font-size:13px; color:var(--text-dim); margin-bottom:10px; line-height:1.6; white-space:pre-wrap; padding:10px 12px; background:var(--bg); border-radius:8px; display:none; }
.wrong-explain.open { display:block; }
.wrong-actions { display:flex; gap:6px; flex-wrap:wrap; }

/* LIGHTBOX */
.lightbox { display:none; position:fixed; inset:0; background:rgba(0,0,0,.88); z-index:300; align-items:center; justify-content:center; cursor:zoom-out; }
.lightbox.show { display:flex; }
.lightbox img { max-width:92vw; max-height:92vh; object-fit:contain; border-radius:10px; }
.lightbox-close { position:fixed; top:16px; right:20px; font-size:30px; color:#fff; cursor:pointer; }

/* SCORE MODAL */
.overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:100; align-items:center; justify-content:center; }
.overlay.show { display:flex; }
.score-modal { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:36px 32px; text-align:center; max-width:380px; width:92%; animation:popIn .3s cubic-bezier(.34,1.56,.64,1); }
@keyframes popIn { from{opacity:0;transform:scale(.85)} to{opacity:1;transform:scale(1)} }
.score-emoji { font-size:52px; margin-bottom:10px; }
.score-num { font-size:48px; font-weight:900; color:var(--gold); margin-bottom:4px; }
.score-label { font-size:15px; color:var(--text-dim); margin-bottom:6px; }
.score-unit-label { font-size:13px; color:var(--purple-light); margin-bottom:20px; }

.hdr-btn { padding:5px 12px; background:var(--card); border:1px solid var(--border); border-radius:8px; color:var(--text-dim); font-size:12px; font-family:inherit; font-weight:600; cursor:pointer; transition:all .15s; white-space:nowrap; }
.hdr-btn:hover { border-color:var(--purple-light); color:var(--text); }
.empty-state { text-align:center; padding:56px 20px; color:var(--text-dim); }
.empty-state .icon { font-size:44px; margin-bottom:12px; }
::-webkit-scrollbar { width:6px; } ::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }
.toast { position:fixed; bottom:24px; right:24px; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px 18px; font-size:14px; box-shadow:0 8px 24px rgba(0,0,0,.4); z-index:400; opacity:0; transform:translateY(8px); transition:all .25s; pointer-events:none; }
.toast.show { opacity:1; transform:translateY(0); }
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
window.addEventListener('load', () => {
  // Wait for GSI to load
  const checkGSI = setInterval(() => {
    if (window.google && window.google.accounts) {
      clearInterval(checkGSI);
      initGoogleApi();
    }
  }, 200);
});
</script>
</head>
<body>

<header>
  <div class="logo">나만의 <span>오답노트</span></div>
  <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
    <div class="count-badge" id="totalBadge">문제 <strong>0</strong>개</div>
    <button class="hdr-btn" id="gdriveBtn" onclick="gdriveSync()">☁️ 드라이브 연동</button>
    <button class="hdr-btn" onclick="exportData()">💾 내보내기</button>
    <label class="hdr-btn" style="cursor:pointer">📂 불러오기<input type="file" accept=".json" onchange="importData(event)" style="display:none"></label>
  </div>
</header>

<div class="tabs">
  <button class="tab active" onclick="switchTab('make')">✏️ 문제 만들기</button>
  <button class="tab" onclick="switchTab('quiz')">🧪 풀어보기</button>
  <button class="tab" onclick="switchTab('wrong')">📕 오답노트 <span class="dot" id="wrongDot" style="display:none"></span></button>
</div>

<main>

<!-- ══ 문제 만들기 ══ -->
<div class="panel active" id="panel-make">
  <div class="section-title" id="formTitle">새 문제 추가</div>

  <div class="form-group">
    <label>📄 문제</label>
    <div class="content-block">
      <div class="content-block-header">
        <span>텍스트 · 이미지 둘 다 가능 (각각 선택)</span>
        <span style="font-weight:400;font-size:11px"><span class="paste-kbd">Ctrl+V</span> 붙여넣기</span>
      </div>
      <div class="content-block-body">
        <textarea id="qText" placeholder="문제 텍스트 (선택)"></textarea>
        <div class="img-drop-zone" id="qImgZone"
          ondragover="dzDragOver(event,'qImgZone')" ondragleave="dzDragLeave('qImgZone')" ondrop="dzDrop(event,'qImg')">
          <input type="file" accept="image/*" onchange="dzFileSelect(event,'qImg')">
          <div class="dz-icon">🖼️</div>
          <div class="dz-label"><b>클릭</b> · 드래그 · <span class="paste-kbd">Ctrl+V</span></div>
          <img class="dz-preview" id="qImgPreview">
          <button class="img-remove-btn" onclick="dzRemove(event,'qImg')">✕</button>
        </div>
      </div>
    </div>
  </div>

  <div class="form-group">
    <label>✅ 정답</label>
    <div class="content-block">
      <div class="content-block-header">
        <span>텍스트 · 이미지 둘 다 가능</span>
        <span style="font-weight:400;font-size:11px"><span class="paste-kbd">Ctrl+V</span> 붙여넣기</span>
      </div>
      <div class="content-block-body">
        <textarea id="aText" placeholder="정답 텍스트 (선택)"></textarea>
        <div class="img-drop-zone" id="aImgZone"
          ondragover="dzDragOver(event,'aImgZone')" ondragleave="dzDragLeave('aImgZone')" ondrop="dzDrop(event,'aImg')">
          <input type="file" accept="image/*" onchange="dzFileSelect(event,'aImg')">
          <div class="dz-icon">✅</div>
          <div class="dz-label"><b>클릭</b> · 드래그 · <span class="paste-kbd">Ctrl+V</span></div>
          <img class="dz-preview" id="aImgPreview">
          <button class="img-remove-btn" onclick="dzRemove(event,'aImg')">✕</button>
        </div>
      </div>
    </div>
  </div>

  <div class="form-group">
    <label>📝 해설 <span style="color:var(--text-dim);font-size:12px">(선택)</span></label>
    <textarea id="qExplain" placeholder="틀렸을 때 볼 해설"></textarea>
  </div>

  <div class="form-group">
    <label>🏷️ 단원 / 태그 <span style="color:var(--text-dim);font-size:12px">(선택 — 단원별로 풀기·오답 분류에 쓰여요)</span></label>
    <div style="display:flex;gap:8px">
      <input type="text" id="qTag" placeholder="예: 1단원, 수학 미분, 영어 어휘..." list="tagSuggestions" autocomplete="off">
      <datalist id="tagSuggestions"></datalist>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" id="submitBtn" onclick="submitForm()">+ 문제 추가</button>
    <button class="btn btn-ghost" onclick="clearForm()">초기화</button>
    <button class="btn btn-ghost" id="cancelEditBtn" style="display:none;color:var(--text-dim)" onclick="cancelEdit()">✕ 수정 취소</button>
  </div>

  <div class="q-list">
    <div class="empty-state" id="qEmpty"><div class="icon">📝</div><p>아직 문제가 없어요.</p></div>
    <div id="qListInner"></div>
  </div>
</div>

<!-- ══ 풀어보기 ══ -->
<div class="panel" id="panel-quiz">
  <div id="quizEmpty" class="empty-state"><div class="icon">🧪</div><p>먼저 <strong>문제 만들기</strong>에서 문제를 추가하세요.</p></div>

  <!-- 단원 선택 화면 -->
  <div id="unitSelectScreen" style="display:none">
    <div class="unit-select">
      <div class="unit-select-title">📚 단원 선택</div>
      <div class="unit-select-sub">풀고 싶은 단원을 선택하세요. 여러 개 선택도 가능해요.</div>
      <div class="unit-grid" id="unitGrid"></div>
      <div class="btn-row">
        <button class="btn btn-gold" onclick="startQuiz()" id="startQuizBtn">선택한 단원 풀기 →</button>
      </div>
    </div>
  </div>

  <!-- 퀴즈 진행 화면 -->
  <div id="quizArea" style="display:none">
    <div class="quiz-header">
      <div style="display:flex;flex-direction:column;gap:4px">
        <div class="quiz-progress" id="quizProgress"></div>
        <div class="quiz-unit-badge" id="quizUnitBadge"></div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost" onclick="shuffleQuiz()" style="font-size:13px;padding:7px 14px">🔀 섞기</button>

<div class="toast" id="toast"></div>

<script>
const KEY_Q = 'odap_pwa_q';
const KEY_W = 'odap_pwa_w';
const CLIENT_ID = '427985071771-6c40el5dm15iu5aot6ud34lhd703ireq.apps.googleusercontent.com';
const SCOPES = 'https://www.googleapis.com/auth/drive.appdata';
const DRIVE_FILE_NAME = 'odap_data.json';

// ── STATE ──
let questions = [], wrongNotes = [];
let gdriveConnected = false;
let driveFileId = null;
let tokenClient = null;

// Load from localStorage first (fast)
try { questions  = JSON.parse(localStorage.getItem(KEY_Q) || '[]'); } catch(e){}
try { wrongNotes = JSON.parse(localStorage.getItem(KEY_W) || '[]'); } catch(e){}

function save() {
  // Always save to localStorage
  try {
    localStorage.setItem(KEY_Q, JSON.stringify(questions));
    localStorage.setItem(KEY_W, JSON.stringify(wrongNotes));
  } catch(e) {}
  // If Drive connected, save to Drive too (debounced)
  if (gdriveConnected) saveToDrive();
}

// ── GOOGLE DRIVE ──
function initGoogleApi() {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: async (resp) => {
      if (resp.error) { toast('⚠️ 구글 로그인 실패'); return; }
      gdriveConnected = true;
      localStorage.setItem('gdrive_token', resp.access_token);
      updateDriveBtn();
      toast('☁️ 구글 드라이브 연동됐어요! 데이터 불러오는 중...');
      await loadFromDrive();
    }
  });

  // Auto-reconnect if token saved
  const saved = localStorage.getItem('gdrive_token');
  if (saved) {
    gdriveConnected = true;
    updateDriveBtn();
    loadFromDrive();
  }
}

function updateDriveBtn() {
  const btn = document.getElementById('gdriveBtn');
  if (!btn) return;
  if (gdriveConnected) {
    btn.textContent = '☁️ 드라이브 연결됨';
    btn.style.color = 'var(--green)';
    btn.style.borderColor = 'var(--green)';
  } else {
    btn.textContent = '☁️ 드라이브 연동';
    btn.style.color = '';
    btn.style.borderColor = '';
  }
}

function gdriveSync() {
  if (gdriveConnected) {
    if (confirm('구글 드라이브 연동을 해제할까요?')) {
      gdriveConnected = false;
      driveFileId = null;
      localStorage.removeItem('gdrive_token');
      updateDriveBtn();
      toast('드라이브 연동이 해제됐어요.');
    }
    return;
  }
  if (!tokenClient) { toast('⚠️ 구글 API 로딩 중이에요. 잠시 후 다시 시도해주세요.'); return; }
  tokenClient.requestAccessToken();
}

async function driveRequest(method, path, body, token) {
  const t = token || localStorage.getItem('gdrive_token');
  const res = await fetch('https://www.googleapis.com' + path, {
    method,
    headers: {
      'Authorization': 'Bearer ' + t,
      ...(body ? { 'Content-Type': 'application/json' } : {})
    },
    ...(body ? { body: JSON.stringify(body) } : {})
  });
  if (res.status === 401) {
    // Token expired
    gdriveConnected = false;
    localStorage.removeItem('gdrive_token');
    updateDriveBtn();
    toast('⚠️ 드라이브 연결이 만료됐어요. 다시 연동해주세요.');
    return null;
  }
  return res.ok ? res : null;
}

async function findDriveFile() {
  const res = await driveRequest('GET', `/drive/v3/files?spaces=appDataFolder&q=name='${DRIVE_FILE_NAME}'&fields=files(id,name)`);
  if (!res) return null;
  const data = await res.json();
  return data.files && data.files.length > 0 ? data.files[0].id : null;
}

async function loadFromDrive() {
  try {
    driveFileId = await findDriveFile();
    if (!driveFileId) {
      toast('☁️ 드라이브에 저장된 데이터가 없어요. 새로 시작할게요!');
      return;
    }
    const res = await driveRequest('GET', `/drive/v3/files/${driveFileId}?alt=media`);
    if (!res) return;
    const data = await res.json();
    if (data.questions) {
      // Merge with local
      const existQIds = new Set(questions.map(q=>q.id));
      const existWIds = new Set(wrongNotes.map(w=>w.id));
      const addedQ = data.questions.filter(q=>!existQIds.has(q.id));
      const addedW = (data.wrongNotes||[]).filter(w=>!existWIds.has(w.id));
      questions  = [...questions,  ...addedQ];
      wrongNotes = [...wrongNotes, ...addedW];
      try {
        localStorage.setItem(KEY_Q, JSON.stringify(questions));
        localStorage.setItem(KEY_W, JSON.stringify(wrongNotes));
      } catch(e) {}
      renderQList(); updateWrongDot(); updateTagSuggestions();
      toast(`☁️ 드라이브에서 불러왔어요! (문제 ${questions.length}개)`);
    }
  } catch(e) { toast('⚠️ 드라이브 불러오기 실패: ' + e.message); }
}

let saveDriveTimer = null;
function saveToDrive() {
  clearTimeout(saveDriveTimer);
  saveDriveTimer = setTimeout(async () => {
    try {
      const payload = JSON.stringify({ version:1, questions, wrongNotes });
      const token = localStorage.getItem('gdrive_token');
      if (!driveFileId) driveFileId = await findDriveFile();

      if (driveFileId) {
        // Update existing file
        await fetch(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`, {
          method: 'PATCH',
          headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
          body: payload
        });
      } else {
        // Create new file in appDataFolder
        const meta = await fetch('https://www.googleapis.com/drive/v3/files?fields=id', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: DRIVE_FILE_NAME, parents: ['appDataFolder'] })
        });
        const metaData = await meta.json();
        driveFileId = metaData.id;
        await fetch(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`, {
          method: 'PATCH',
          headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
          body: payload
        });
      }
    } catch(e) { console.error('Drive save error:', e); }
  }, 1500); // debounce 1.5초
}

// ── TAGS / UNITS ──
function getAllTags(source) {
  const tags = new Set();
  source.forEach(q => { if (q.tag) q.tag.split(',').map(t=>t.trim()).filter(Boolean).forEach(t=>tags.add(t)); });
  return [...tags].sort();
}

function updateTagSuggestions() {
  const dl = document.getElementById('tagSuggestions');
  dl.innerHTML = getAllTags(questions).map(t=>`<option value="${escHtml(t)}">`).join('');
}

// ── IMAGE FORM STATE ──
const imgs = { qImg: null, aImg: null };
let pasteTarget = 'qImg';

document.querySelectorAll('.img-drop-zone').forEach(zone => {
  zone.addEventListener('click', () => { pasteTarget = zone.id === 'qImgZone' ? 'qImg' : 'aImg'; });
});

document.addEventListener('paste', e => {
  if (!document.getElementById('panel-make').classList.contains('active')) return;
  for (const item of (e.clipboardData?.items || [])) {
    if (item.type.startsWith('image/')) {
      const file = item.getAsFile();
      const active = document.activeElement;
      let target = pasteTarget;
      if (active?.id === 'qText') target = 'qImg';
      if (active?.id === 'aText') target = 'aImg';
      readImg(file, target);
      toast(`📋 ${target==='qImg'?'문제':'정답'} 이미지로 붙여넣었어요`);
      break;
    }
  }
});

function dzDragOver(e, zoneId) { e.preventDefault(); document.getElementById(zoneId).classList.add('drag-over'); }
function dzDragLeave(zoneId)   { document.getElementById(zoneId).classList.remove('drag-over'); }
function dzDrop(e, key) {
  e.preventDefault(); dzDragLeave(key+'Zone');
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) readImg(file, key);
}
function dzFileSelect(e, key) { const file=e.target.files[0]; if(file) readImg(file, key); }
function readImg(file, key) {
  const r = new FileReader();
  r.onload = ev => { imgs[key]=ev.target.result; showDZPreview(key, ev.target.result); };
  r.readAsDataURL(file);
}
function showDZPreview(key, src) {
  document.getElementById(key+'Zone').classList.add('has-image');
  document.getElementById(key+'Preview').src = src;
}
function dzRemove(e, key) {
  e.stopPropagation(); e.preventDefault();
  imgs[key]=null;
  document.getElementById(key+'Zone').classList.remove('has-image');
  document.getElementById(key+'Preview').src='';
  document.getElementById(key+'Zone').querySelector('input[type="file"]').value='';
}

// ── ADD QUESTION ──
let editingId = null;

function submitForm() {
  if (editingId !== null) { saveEdit(); return; }
  addQuestion();
}

function addQuestion() {
  const qText = document.getElementById('qText').value.trim();
  const aText = document.getElementById('aText').value.trim();
  if (!qText && !imgs.qImg) { toast('⚠️ 문제 텍스트나 이미지를 입력해주세요'); return; }
  if (!aText && !imgs.aImg) { toast('⚠️ 정답 텍스트나 이미지를 입력해주세요'); return; }
  questions.push({
    id: Date.now(),
    qText, qImg: imgs.qImg,
    aText, aImg: imgs.aImg,
    explain: document.getElementById('qExplain').value.trim(),
    tag: document.getElementById('qTag').value.trim(),
    created: new Date().toLocaleDateString('ko')
  });
  save(); renderQList(); clearForm(); updateTagSuggestions();
  toast('✅ 문제가 추가됐어요!');
}

function clearForm() {
  ['qImg','aImg'].forEach(k => dzRemove({stopPropagation:()=>{},preventDefault:()=>{}}, k));
  ['qText','aText','qExplain','qTag'].forEach(id => document.getElementById(id).value='');
  editingId = null;
  document.getElementById('formTitle').textContent = '새 문제 추가';
  document.getElementById('submitBtn').textContent = '+ 문제 추가';
  document.getElementById('cancelEditBtn').style.display = 'none';
}

function editQ(id) {
  const q = questions.find(q=>q.id===id);
  if (!q) return;
  // scroll to top
  window.scrollTo({top:0, behavior:'smooth'});
  // fill form
  document.getElementById('qText').value = q.qText || '';
  document.getElementById('aText').value = q.aText || '';
  document.getElementById('qExplain').value = q.explain || '';
  document.getElementById('qTag').value = q.tag || '';
  // images
  ['qImg','aImg'].forEach(k => dzRemove({stopPropagation:()=>{},preventDefault:()=>{}}, k));
  if (q.qImg) { imgs.qImg = q.qImg; showDZPreview('qImg', q.qImg); }
  if (q.aImg) { imgs.aImg = q.aImg; showDZPreview('aImg', q.aImg); }
  // update UI
  editingId = id;
  document.getElementById('formTitle').textContent = '✏️ 문제 수정 중';
  document.getElementById('submitBtn').textContent = '✅ 수정 완료';
  document.getElementById('submitBtn').style.background = 'var(--gold)';
  document.getElementById('submitBtn').style.color = '#1A1230';
  document.getElementById('cancelEditBtn').style.display = '';
  toast('✏️ 수정할 내용을 변경하고 완료 버튼을 누르세요');
}

function saveEdit() {
  const qText = document.getElementById('qText').value.trim();
  const aText = document.getElementById('aText').value.trim();
  if (!qText && !imgs.qImg) { toast('⚠️ 문제 텍스트나 이미지를 입력해주세요'); return; }
  if (!aText && !imgs.aImg) { toast('⚠️ 정답 텍스트나 이미지를 입력해주세요'); return; }
  const idx = questions.findIndex(q=>q.id===editingId);
  if (idx < 0) return;
  questions[idx] = {
    ...questions[idx],
    qText, qImg: imgs.qImg,
    aText, aImg: imgs.aImg,
    explain: document.getElementById('qExplain').value.trim(),
    tag: document.getElementById('qTag').value.trim(),
  };
  // update wrongNotes too
  wrongNotes.forEach(w => {
    if (w.qid === editingId) {
      w.qText = qText; w.qImg = imgs.qImg;
      w.aText = aText; w.aImg = imgs.aImg;
      w.explain = document.getElementById('qExplain').value.trim();
      w.tag = document.getElementById('qTag').value.trim();
    }
  });
  save(); renderQList(); clearForm(); updateTagSuggestions();
  document.getElementById('submitBtn').style.background = '';
  document.getElementById('submitBtn').style.color = '';
  toast('✅ 수정됐어요!');
}

function cancelEdit() {
  clearForm();
  document.getElementById('submitBtn').style.background = '';
  document.getElementById('submitBtn').style.color = '';
  toast('수정이 취소됐어요.');
}

function addQuestion() {
  const qText = document.getElementById('qText').value.trim();
  const aText = document.getElementById('aText').value.trim();
  if (!qText && !imgs.qImg) { toast('⚠️ 문제 텍스트나 이미지를 입력해주세요'); return; }
  if (!aText && !imgs.aImg) { toast('⚠️ 정답 텍스트나 이미지를 입력해주세요'); return; }
  questions.push({
    id: Date.now(),
    qText, qImg: imgs.qImg,
    aText, aImg: imgs.aImg,
    explain: document.getElementById('qExplain').value.trim(),
    tag: document.getElementById('qTag').value.trim(),
    created: new Date().toLocaleDateString('ko')
  });
  save(); renderQList(); clearForm(); updateTagSuggestions();
  toast('✅ 문제가 추가됐어요!');
}

function clearForm() {
  ['qImg','aImg'].forEach(k => dzRemove({stopPropagation:()=>{},preventDefault:()=>{}}, k));
  ['qText','aText','qExplain','qTag'].forEach(id => document.getElementById(id).value='');
}

// ── RENDER Q LIST ──
function renderQList() {
  document.getElementById('qEmpty').style.display = questions.length ? 'none' : '';
  document.getElementById('totalBadge').innerHTML = `문제 <strong>${questions.length}</strong>개`;
  const inner = document.getElementById('qListInner');
  inner.innerHTML = '';
  questions.forEach((q, i) => {
    const div = document.createElement('div');
    div.className = 'q-item';
    div.innerHTML = `
      <div class="q-num">${i+1}</div>
      <div class="q-body">
        <div class="q-preview-row">
          <div class="q-preview-col">
            <div class="q-preview-label">문제</div>
            ${q.qText ? `<div class="q-preview-text">${escHtml(q.qText.length>60?q.qText.slice(0,60)+'…':q.qText)}</div>` : ''}
            ${q.qImg  ? `<img class="q-thumb" src="${q.qImg}" onclick="openLBSrc(this.src)" title="크게 보기">` : ''}
          </div>
          <div style="width:1px;background:var(--border);margin:0 4px;align-self:stretch"></div>
          <div class="q-preview-col">
            <div class="q-preview-label">정답</div>
            ${q.aText ? `<div class="q-preview-text">${escHtml(q.aText.length>60?q.aText.slice(0,60)+'…':q.aText)}</div>` : ''}
            ${q.aImg  ? `<img class="q-thumb" src="${q.aImg}" onclick="openLBSrc(this.src)" title="크게 보기">` : ''}
          </div>
        </div>
        <div class="q-meta">
          ${q.tag ? q.tag.split(',').map(t=>`<span class="q-tag">${escHtml(t.trim())}</span>`).join('') : '<span style="color:var(--text-dim);font-size:11px">단원 없음</span>'}
          <span>${q.created}</span>
          ${q.explain ? '<span>📝 해설</span>' : ''}
        </div>
      </div>
      <div class="q-actions" style="display:flex;flex-direction:column;gap:6px"><button class="btn btn-ghost" style="font-size:12px;padding:6px 12px" onclick="editQ(${q.id})">✏️ 수정</button><button class="btn btn-danger" onclick="deleteQ(${q.id})">삭제</button></div>`;
    inner.appendChild(div);
  });
}

function deleteQ(id) {
  if (!confirm('이 문제를 삭제할까요?')) return;
  questions  = questions.filter(q=>q.id!==id);
  wrongNotes = wrongNotes.filter(w=>w.qid!==id);
  save(); renderQList(); updateWrongDot(); updateTagSuggestions();
}

// ── TABS ──
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['make','quiz','wrong'][i]===tab));

// ── QUIZ — UNIT SELECT ──
let selectedUnits = new Set(); // empty = all
let quizOrder=[], quizIdx=0, quizCorrect=0, quizUnitLabel='';

function initQuizTab() {
  if (!questions.length) {
    document.getElementById('quizEmpty').style.display='';
    document.getElementById('unitSelectScreen').style.display='none';
    document.getElementById('quizArea').style.display='none';
    return;
  }
  document.getElementById('quizEmpty').style.display='none';
  // reset quiz state when coming back to tab
  quizOrder=[]; quizIdx=0; quizCorrect=0;
  showUnitSelectScreen();
}

function showUnitSelectScreen() {
  document.getElementById('unitSelectScreen').style.display='';
  document.getElementById('quizArea').style.display='none';
  selectedUnits = new Set();
  renderUnitGrid();
}

function renderUnitGrid() {
  const grid = document.getElementById('unitGrid');
  const tags = getAllTags(questions);
  const noTagCount = questions.filter(q=>!q.tag).length;

  grid.innerHTML = '';

  // 전체 카드
  const allCard = document.createElement('div');
  allCard.className = 'unit-card unit-all-card selected';
  allCard.dataset.unit = '__all__';
  allCard.innerHTML = `<div class="unit-card-name">📚 전체 문제</div><div class="unit-card-count">${questions.length}문제</div><div class="unit-card-check">✓</div>`;
  allCard.onclick = () => toggleUnitAll(allCard);
  grid.appendChild(allCard);
  selectedUnits.add('__all__');

  tags.forEach(tag => {
    const cnt = questions.filter(q=>q.tag && q.tag.split(',').map(t=>t.trim()).includes(tag)).length;
    const card = document.createElement('div');
    card.className = 'unit-card';
    card.dataset.unit = tag;
    card.innerHTML = `<div class="unit-card-name">${escHtml(tag)}</div><div class="unit-card-count">${cnt}문제</div><div class="unit-card-check">✓</div>`;
    card.onclick = () => toggleUnit(card, tag);
    grid.appendChild(card);
  });

  if (noTagCount > 0) {
    const card = document.createElement('div');
    card.className = 'unit-card';
    card.dataset.unit = '__notag__';
    card.innerHTML = `<div class="unit-card-name">🏷️ 단원 없음</div><div class="unit-card-count">${noTagCount}문제</div><div class="unit-card-check">✓</div>`;
    card.onclick = () => toggleUnit(card, '__notag__');
    grid.appendChild(card);
  }
}

function toggleUnitAll(card) {
  // selecting all deselects individual
  selectedUnits.clear();
  selectedUnits.add('__all__');
  document.querySelectorAll('.unit-card').forEach(c => c.classList.remove('selected'));
  card.classList.add('selected');
}

function toggleUnit(card, tag) {
  // deselect "all" when picking specific
  selectedUnits.delete('__all__');
  document.querySelector('.unit-all-card')?.classList.remove('selected');

  if (selectedUnits.has(tag)) {
    selectedUnits.delete(tag);
    card.classList.remove('selected');
    // if nothing selected, go back to all
    if (selectedUnits.size === 0) {
      selectedUnits.add('__all__');
      document.querySelector('.unit-all-card')?.classList.add('selected');
    }
  } else {
    selectedUnits.add(tag);
    card.classList.add('selected');
  }
}

function getQuestionsForSelectedUnits() {
  if (selectedUnits.has('__all__')) return questions;
  return questions.filter(q => {
    const qtags = q.tag ? q.tag.split(',').map(t=>t.trim()) : [];
    for (const u of selectedUnits) {
      if (u === '__notag__' && qtags.length===0) return true;
      if (qtags.includes(u)) return true;
    }
    return false;
  });
}

function startQuiz() {
  const pool = getQuestionsForSelectedUnits();
  if (!pool.length) { toast('⚠️ 선택한 단원에 문제가 없어요'); return; }

  quizOrder = pool.map((_,i)=>i).map(i=>questions.indexOf(pool[i]));
  quizIdx=0; quizCorrect=0;

  if (selectedUnits.has('__all__')) {
    quizUnitLabel = '전체 문제';
  } else {
    quizUnitLabel = [...selectedUnits].map(u=>u==='__notag__'?'단원 없음':u).join(', ');
  }

  document.getElementById('unitSelectScreen').style.display='none';
  document.getElementById('quizArea').style.display='';
  document.getElementById('quizUnitBadge').textContent = `📚 ${quizUnitLabel} · ${pool.length}문제`;
  renderQuizCard();
}

function backToUnitSelect() {
  quizOrder=[]; quizIdx=0; quizCorrect=0;
  showUnitSelectScreen();
}

function shuffleQuiz() {
  const pool = getQuestionsForSelectedUnits();
  quizOrder = pool.map((_,i)=>questions.indexOf(pool[i])).sort(()=>Math.random()-.5);
  quizIdx=0; quizCorrect=0; renderQuizCard();
}

function renderQuizCard() {
  const total = quizOrder.length;
  document.getElementById('quizProgress').textContent = `${quizIdx+1} / ${total}`;
  document.getElementById('progressFill').style.width = `${(quizIdx/total)*100}%`;
  const q = questions[quizOrder[quizIdx]];
  const qtags = q.tag ? q.tag.split(',').map(t=>t.trim()).filter(Boolean) : [];

  const qContent =
    (q.qText ? `<div class="quiz-text">${escHtml(q.qText)}</div>` : '') +
    (q.qImg  ? `<img class="quiz-img" src="${q.qImg}" onclick="openLBSrc(this.src)">` : '');
  const aContent =
    (q.aText ? `<div class="quiz-text" style="font-size:15px">${escHtml(q.aText)}</div>` : '') +
    (q.aImg  ? `<img class="quiz-img" src="${q.aImg}" onclick="openLBSrc(this.src)">` : '');

  document.getElementById('quizContent').innerHTML = `
    <div class="quiz-card">
      <div class="quiz-q-num">
        문제 ${quizIdx+1}
        ${qtags.map(t=>`<span class="q-tag">${escHtml(t)}</span>`).join('')}
      </div>
      ${qContent}
      <button class="reveal-btn" onclick="revealAns(this)">✅ 정답 보기</button>
      <div class="answer-reveal" id="ansReveal">
        <div class="answer-label">✅ 정답</div>
        ${aContent}
        ${q.explain ? `<div class="explain-text">📝 ${escHtml(q.explain)}</div>` : ''}
        <div class="self-judge">
          <button class="btn btn-ghost" style="color:var(--green);border-color:var(--green)" onclick="judge(true)">⭕ 맞혔어요</button>
          <button class="btn btn-ghost" style="color:var(--red);border-color:var(--red)" onclick="judge(false)">❌ 틀렸어요</button>
        </div>
      </div>
    </div>
    <div class="quiz-nav">
      <button class="btn btn-ghost quiz-back-btn" onclick="backToUnitSelect()">← 단원 선택</button>
      <button class="btn btn-gold" id="nextBtn" style="display:none" onclick="nextQ()">${quizIdx+1<total?'다음 문제 →':'결과 보기 🎉'}</button>
    </div>`;
}

function revealAns(btn) { btn.style.display='none'; document.getElementById('ansReveal').classList.add('open'); }

function judge(correct) {
  document.querySelector('.self-judge').style.display='none';
  if (correct) quizCorrect++;
  else addWrongNote(questions[quizOrder[quizIdx]]);
  document.getElementById('nextBtn').style.display='';
}

function nextQ() {
  quizIdx++;
  if (quizIdx >= quizOrder.length) { showScore(); return; }
  renderQuizCard();
}

function showScore() {
  const total=quizOrder.length, pct=Math.round((quizCorrect/total)*100);
  const emoji=pct===100?'🏆':pct>=80?'🎉':pct>=60?'😊':pct>=40?'😅':'😢';
  document.getElementById('scoreEmoji').textContent=emoji;
  document.getElementById('scoreNum').textContent=`${pct}점`;
  document.getElementById('scoreLabel').textContent=`${total}문제 중 ${quizCorrect}개 맞힘`;
  document.getElementById('scoreUnitLabel').textContent=`📚 ${quizUnitLabel}`;
  document.getElementById('scoreOverlay').classList.add('show');
  quizOrder=[];
}
function closeScore() { document.getElementById('scoreOverlay').classList.remove('show'); showUnitSelectScreen(); }
function goWrong()    { document.getElementById('scoreOverlay').classList.remove('show'); switchTab('wrong'); }

// ── WRONG NOTE ──
function addWrongNote(q) {
  const ex = wrongNotes.find(w=>w.qid===q.id);
  if (ex) { ex.count=(ex.count||1)+1; ex.lastWrong=new Date().toLocaleDateString('ko'); ex.mastered=false; }
  else wrongNotes.push({ id:Date.now(), qid:q.id, qText:q.qText, qImg:q.qImg, aText:q.aText, aImg:q.aImg, explain:q.explain, tag:q.tag, count:1, mastered:false, lastWrong:new Date().toLocaleDateString('ko') });
  save(); updateWrongDot();
}

function updateWrongDot() {
  document.getElementById('wrongDot').style.display = wrongNotes.some(w=>!w.mastered)?'':'none';
}

let currentFilter='all', currentView='list';

function filterWrong(f, btn) {
  currentFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderWrong(f);
}

function setView(v, btn) {
  currentView=v;
  document.querySelectorAll('.view-toggle button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderWrong(currentFilter);
}

function renderWrong(filter) {
  const area=document.getElementById('wrongArea'), empty=document.getElementById('wrongEmpty'), list=document.getElementById('wrongList');
  let items=wrongNotes;
  if (filter==='todo')     items=wrongNotes.filter(w=>!w.mastered);
  if (filter==='mastered') items=wrongNotes.filter(w=>w.mastered);

  if (!wrongNotes.length) { empty.style.display=''; area.style.display='none'; return; }
  empty.style.display='none'; area.style.display='';
  list.innerHTML='';

  if (!items.length) { list.innerHTML=`<div class="empty-state" style="padding:40px 0"><p>해당 항목이 없어요.</p></div>`; return; }

  if (currentView==='unit') {
    renderWrongByUnit(items, list);
  } else {
    items.slice().reverse().forEach(w => list.appendChild(makeWrongCard(w)));
  }
}

function renderWrongByUnit(items, list) {
  // group by tag
  const groups = {};
  items.forEach(w => {
    const tags = w.tag ? w.tag.split(',').map(t=>t.trim()).filter(Boolean) : [];
    if (tags.length===0) {
      (groups['__notag__'] = groups['__notag__']||[]).push(w);
    } else {
      tags.forEach(t => (groups[t] = groups[t]||[]).push(w));
    }
  });

  const sortedKeys = Object.keys(groups).sort((a,b)=>a==='__notag__'?1:b==='__notag__'?-1:a.localeCompare(b));

  sortedKeys.forEach(key => {
    const groupItems = groups[key];
    const groupDiv = document.createElement('div');
    groupDiv.className = 'unit-group';
    groupDiv.innerHTML = `
      <div class="unit-group-header" onclick="toggleGroup(this.parentElement)">
        <div class="unit-group-title">
          📂 ${key==='__notag__'?'단원 없음':escHtml(key)}
          <span class="unit-group-count">${groupItems.length}개</span>
        </div>
        <span class="unit-group-arrow">▾</span>
      </div>
      <div class="unit-group-body"></div>`;
    const body = groupDiv.querySelector('.unit-group-body');
    groupItems.slice().reverse().forEach(w => body.appendChild(makeWrongCard(w)));
    list.appendChild(groupDiv);
  });
}

function toggleGroup(groupEl) {
  groupEl.classList.toggle('collapsed');
}

function makeWrongCard(w) {
  const div = document.createElement('div');
  div.className = 'wrong-card'+(w.mastered?' mastered':'');
  const tags = w.tag ? w.tag.split(',').map(t=>t.trim()).filter(Boolean) : [];
  div.innerHTML = `
    <div class="wrong-preview-row">
      <div class="q-preview-col">
        <div class="q-preview-label">문제</div>
        ${w.qText ? `<div class="q-preview-text">${escHtml(w.qText.length>80?w.qText.slice(0,80)+'…':w.qText)}</div>` : ''}
        ${w.qImg  ? `<img class="q-thumb" src="${w.qImg}" onclick="openLBSrc(this.src)">` : ''}
      </div>
      <div style="width:1px;background:var(--border);margin:0 4px;align-self:stretch"></div>
      <div class="q-preview-col">
        <div class="q-preview-label">정답</div>
        ${w.aText ? `<div class="q-preview-text">${escHtml(w.aText.length>80?w.aText.slice(0,80)+'…':w.aText)}</div>` : ''}
        ${w.aImg  ? `<img class="q-thumb" src="${w.aImg}" onclick="openLBSrc(this.src)">` : ''}
      </div>
      ${w.mastered?'<span class="mastered-badge" style="align-self:flex-start;margin-left:auto">✓ 완료</span>':''}
    </div>
    <div class="wrong-meta">
      <span>❌ ${w.count}회 틀림</span>
      <span>${w.lastWrong}</span>
      ${tags.map(t=>`<span class="q-tag">${escHtml(t)}</span>`).join('')}
      ${w.explain?`<button class="btn btn-ghost" style="font-size:12px;padding:3px 10px" onclick="toggleExp(${w.id})">해설 ▾</button>`:''}
    </div>
    ${w.explain?`<div class="wrong-explain" id="exp_${w.id}">📝 ${escHtml(w.explain)}</div>`:''}
    <div class="wrong-actions">
      ${!w.mastered
        ?`<button class="btn btn-ghost" style="font-size:12px;padding:6px 12px;color:var(--green);border-color:var(--green)" onclick="masterW(${w.id})">✓ 완료로 표시</button>`
        :`<button class="btn btn-ghost" style="font-size:12px;padding:6px 12px" onclick="unmasterW(${w.id})">↩ 복습 필요</button>`}
      <button class="btn btn-danger" onclick="deleteW(${w.id})">삭제</button>
    </div>`;
  return div;
}

function toggleExp(id) { document.getElementById('exp_'+id)?.classList.toggle('open'); }
function masterW(id)   { const w=wrongNotes.find(w=>w.id===id); if(w){w.mastered=true; save();updateWrongDot();renderWrong(currentFilter);toast('✅ 완료로 표시됐어요!');} }
function unmasterW(id) { const w=wrongNotes.find(w=>w.id===id); if(w){w.mastered=false;save();updateWrongDot();renderWrong(currentFilter);} }
function deleteW(id)   { if(!confirm('오답노트에서 삭제할까요?'))return; wrongNotes=wrongNotes.filter(w=>w.id!==id);save();updateWrongDot();renderWrong(currentFilter); }

// ── LIGHTBOX ──
function openLBSrc(src) { document.getElementById('lbImg').src=src; document.getElementById('lightbox').classList.add('show'); }
function closeLB()       { document.getElementById('lightbox').classList.remove('show'); }
document.addEventListener('keydown', e => { if(e.key==='Escape') closeLB(); });

// ── UTILS ──
function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>'); }
function toast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2400); }

// ── EXPORT / IMPORT ──
function exportData() {
  if (!questions.length && !wrongNotes.length) { toast('⚠️ 저장된 데이터가 없어요'); return; }
  const payload = { version: 1, exportedAt: new Date().toISOString(), questions, wrongNotes };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const date = new Date().toLocaleDateString('ko').replace(/\. /g,'-').replace('.','');
  a.href = url; a.download = `오답노트_백업_${date}.json`;
  a.click(); URL.revokeObjectURL(url);
  toast('💾 백업 파일이 다운로드됐어요!');
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!Array.isArray(data.questions)) throw new Error('형식 오류');
      if (!confirm(`백업 파일에 문제 ${data.questions.length}개, 오답 ${(data.wrongNotes||[]).length}개가 있어요.\n현재 데이터에 합칠까요?\n(취소하면 현재 데이터를 유지해요)`)) { e.target.value=''; return; }
      // merge: add items whose id doesn't already exist
      const existQIds = new Set(questions.map(q=>q.id));
      const existWIds = new Set(wrongNotes.map(w=>w.id));
      const addedQ = data.questions.filter(q=>!existQIds.has(q.id));
      const addedW = (data.wrongNotes||[]).filter(w=>!existWIds.has(w.id));
      questions  = [...questions,  ...addedQ];
      wrongNotes = [...wrongNotes, ...addedW];
      save(); renderQList(); updateWrongDot(); updateTagSuggestions();
      toast(`✅ 문제 ${addedQ.length}개, 오답 ${addedW.length}개 불러왔어요!`);
    } catch(err) {
      toast('⚠️ 파일을 읽을 수 없어요. 올바른 백업 파일인지 확인해주세요.');
    }
    e.target.value='';
  };
  reader.readAsText(file);
}

// ── INIT ──
renderQList();
updateWrongDot();
updateTagSuggestions();
</script>

<div id="installBar" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#1E1D3A;border-top:1px solid #35336A;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;z-index:500;gap:10px">
  <span style="font-size:14px">📱 홈 화면에 추가하면 앱처럼 쓸 수 있어요!</span>
  <button onclick="installApp()" style="background:#7B5EA7;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap">설치하기</button>
  <button onclick="document.getElementById('installBar').style.display='none'" style="background:transparent;border:none;color:#9990B8;font-size:20px;cursor:pointer;padding:0 4px">✕</button>
</div>

<script>
// Service Worker 등록
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(e => console.log('SW error:', e));
  });
}

// 홈 화면 설치 배너
let deferredPrompt;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBar').style.display = 'flex';
});
function installApp() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(() => {
    deferredPrompt = null;
    document.getElementById('installBar').style.display = 'none';
  });
}
window.addEventListener('appinstalled', () => {
  document.getElementById('installBar').style.display = 'none';
});
</script>
</body>
